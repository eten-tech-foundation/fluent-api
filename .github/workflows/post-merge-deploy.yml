# Deploys Fluent API to Azure Web Apps after a merge or a release cut.
#
#   push to main -> Development, automatically
#   tag vYY.MM.N -> QA, automatically
#
# Production is deliberately NOT reachable from here. It is a manual dispatch
# of `promote-to-prod.yml`, which refuses any tag with no successful QA deploy.
name: Post-merge-deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate CalVer tag format
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "::error::Tag '$TAG' does not match required CalVer format vYY.MM.SERIAL (e.g. v26.07.1)"
            exit 1
          fi
          echo "Tag '$TAG' is valid."

      # Empty for a branch push: dev keeps whatever package.json already says,
      # and the deploy skips the version assertion.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      # Pin to the SHA rather than the ref, so a tag moved while this run is in
      # flight cannot make the deploy job build something else.
      ref: ${{ github.sha }}
      version: ${{ needs.meta.outputs.version }}

  deploy-dev:
    if: github.ref_type == 'branch'
    needs: [meta, build]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      environment: Development
      app_name: scribe-server-dev

  deploy-qa:
    if: github.ref_type == 'tag'
    needs: [meta, build]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      environment: QA
      app_name: fluent-server-qa
      expect_version: ${{ needs.meta.outputs.version }}
