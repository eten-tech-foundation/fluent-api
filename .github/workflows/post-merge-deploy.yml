# Deploys Fluent API to the Development Azure Web App after every merge to main.
#
# Tags are deliberately NOT a trigger here. `cut-release.yml` already deploys
# the tag to QA when it's pushed, and `deploy-to-qa.yml` covers hand-pushed
# tags; a tag trigger on this file would deploy QA a second time.
#
# Production is deliberately NOT reachable from here either. It is a manual
# dispatch of `promote-to-prod.yml`, which refuses any tag with no successful
# QA deploy.
name: Post-merge-deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Pin to the SHA rather than the ref, so a push that moved main while
      # this run is in flight cannot make the deploy job build something else.
      ref: ${{ github.sha }}

  deploy-dev:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      environment: Development
      app_name: scribe-server-dev
    # Required: without it `secrets.*` is EMPTY in deploy.yml, environment
    # or not. See the secrets note at the top of deploy.yml.
    secrets: inherit
