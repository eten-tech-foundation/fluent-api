# Validates Pull Requests by running linting, testing, and type checking
name: Pre-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          CXXFLAGS: '-std=c++20'

      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build test
        run: npm run build

  dlq-integration:
    name: Dead-letter queue integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dlq-local-test
          POSTGRES_DB: fluent_dlq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluent_dlq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          CXXFLAGS: '-std=c++20'

      - name: Exercise retries, retention and DLQ observability
        run: npm test -- --run src/lib/dead-letter-queues.integration.test.ts --maxWorkers=2
        env:
          DLQ_TEST_DATABASE_URL: postgres://postgres:dlq-local-test@127.0.0.1:5432/fluent_dlq_test

  docs-structure:
    name: Docs Structure Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: ./scripts/check-docs-structure.sh
