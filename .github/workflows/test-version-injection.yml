name: Test Version Injection

on:
  pull_request:
    paths:
      - package.json
      - src/routes/health.route.ts
      - '.github/workflows/**'

jobs:
  test-health-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Inject fixture version via jq
        run: |
          VERSION="00.00.99"
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          echo "Injected version: $VERSION"

      - name: Verify jq injection worked
        run: |
          ACTUAL=$(jq -r '.version' package.json)
          if [ "$ACTUAL" = "00.00.99" ]; then
            echo "::notice::package.json version field is '$ACTUAL' — jq injection verified!"
          else
            echo "::error::Expected '00.00.99' but got '$ACTUAL'"
            exit 1
          fi

      - name: Verify updated package.json is readable by Node
        run: |
          # In production, Azure starts the app via `npm start`, which auto-sets
          # process.env.npm_package_version from package.json. We can't boot the
          # full server here (it needs a database), so instead we verify the
          # critical link: jq successfully patched package.json and Node can
          # read the updated version at runtime.
          RUNTIME_VERSION=$(node -e "
            const pkg = require('./package.json');
            console.log(pkg.version);
          ")
          if [ "$RUNTIME_VERSION" = "00.00.99" ]; then
            echo "::notice::Runtime version is '$RUNTIME_VERSION' — end-to-end chain verified!"
          else
            echo "::error::Runtime version mismatch: expected '00.00.99', got '$RUNTIME_VERSION'"
            exit 1
          fi
