# Deploys an already-cut tag to production.
#
# This is the only route to production. It refuses a tag that has no successful
# QA deployment, so QA cannot be skipped by taking this path instead, and it is
# equally the redeploy and rollback path -- see docs/runbooks/deployment/.
#
# Production's required reviewers apply on top, and they are what actually
# gates this: the approval lives on the Environment, not on a job here, so it
# cannot be bypassed by adding another workflow that deploys to production.
name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: QA-approved release tag to promote (e.g. v26.08.3)
        required: true
        type: string
      skip_qa_check:
        description: 'Emergency only: promote a tag with no successful QA deploy'
        required: false
        type: boolean
        default: false

concurrency: production-deploy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # `${{ }}` is substituted into the script before the shell ever runs it,
      # so a crafted input would execute ahead of the regex below. Everything
      # derived from `inputs` therefore arrives through `env`.
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "::error::Tag '$TAG' does not match required CalVer format vYY.MM.SERIAL (e.g. v26.07.1)"
            exit 1
          fi

      # Resolved through `git/ref/tags/` rather than `commits/{ref}`, which
      # accepts an unqualified name and so would happily resolve a BRANCH
      # called v26.08.3 -- a CalVer-shaped branch name passes the regex above.
      # Only a real tag may be promoted.
      - name: Resolve tag to a commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          object=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha') || {
            echo "::error::No tag '$TAG' in $REPO. A branch of that name is not promotable."
            exit 1
          }
          read -r type sha <<< "$object"

          # `git tag` makes a lightweight tag, which points straight at the
          # commit. An annotated one (`git tag -a`) points at a tag object that
          # has to be dereferenced first.
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/$REPO/git/tags/$sha" --jq '.object.sha')
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' is $sha."

      - name: Confirm the tag passed QA
        if: ${{ !inputs.skip_qa_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Matched on sha, not ref. A deployment's `ref` is the ref of the
          # workflow RUN rather than whatever the job checked out, so a QA
          # deploy triggered some other way (a re-run dispatched from main, say)
          # would not be found by tag name even though it deployed this commit.
          ids=$(gh api "repos/$REPO/deployments?environment=QA&sha=$SHA" --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "::error::No QA deployment found for '$TAG' ($SHA). Deploy it to QA before promoting."
            exit 1
          fi
          for id in $ids; do
            if gh api "repos/$REPO/deployments/$id/statuses" --jq '.[].state' | grep -qx success; then
              echo "Tag '$TAG' has a successful QA deployment (deployment $id)."
              exit 0
            fi
          done
          echo "::error::Tag '$TAG' was deployed to QA but no deployment succeeded."
          exit 1

      - name: Warn on skipped QA check
        if: ${{ inputs.skip_qa_check }}
        env:
          TAG: ${{ inputs.tag }}
          ACTOR: ${{ github.actor }}
        run: echo "::warning::QA verification skipped for '$TAG' by $ACTOR."

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.version }}

  deploy-prod:
    needs: [validate, build]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      environment: Production
      app_name: fluent-server-prod
      expect_version: ${{ needs.validate.outputs.version }}
      verify_delay: 45
      verify_attempts: 12
      verify_interval: 15
