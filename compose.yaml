services:
  db:
    container_name: fluent-api-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluent
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - fluent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d fluent]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    container_name: fluent-api-azurite
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - '10000'
      - --location
      - /data
      # The storage SDK may speak a newer API version than the emulator advertises.
      - --skipApiVersionCheck

    ports:
      - '${AZURITE_PORT:-10000}:10000'
    volumes:
      - fluent-azurite:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"

      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: fluent-api-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '${PORT:-9999}:9999'
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - fluent-api-node-modules:/app/node_modules
    env_file: .env
    environment:
      BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      MIGRATIONS_DATABASE_URL: postgres://api_migrator:password@db:5432/fluent
      DATABASE_URL: postgres://api_user:password@db:5432/fluent
      # Azurite (local Azure Blob emulator) — well-known dev credentials.
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    user: '1001:1001'
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9999/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    container_name: fluent-api-worker
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - fluent-worker-node-modules:/app/node_modules
    env_file: .env
    environment:
      BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@db:5432/fluent
      MIGRATIONS_DATABASE_URL: postgres://api_migrator:password@db:5432/fluent
      DATABASE_URL: postgres://api_user:password@db:5432/fluent
      # Azurite (local Azure Blob emulator) — well-known dev credentials.
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    command: [dumb-init, --, npx, tsx, watch, src/workers/standalone-worker.ts]
    user: '1001:1001'
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
      azurite:
        condition: service_healthy

volumes:
  fluent-pgdata:
  fluent-api-node-modules:
  fluent-worker-node-modules:
  fluent-azurite:
